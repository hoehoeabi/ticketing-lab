spring:
  profiles:
    include: secret # application-secret.yml을 불러옵니다.
  application:
    name: ticketing-lab

  # MySQL 설정 (로컬 DB)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # JPA / Hibernate 설정
  jpa:
    hibernate:
      ddl-auto: update # 개발 단계용 (추후 validate/none으로 전환)
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        default_batch_fetch_size: 100 # N+1 최적화용
    open-in-view: false # [성능 최적화] OSIV 비활성화: DB 커넥션을 트랜잭션(Service) 종료 시 즉시 반납하여 커넥션 고갈 방지

  # Redis 설정 (로컬 Redis)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  # SMTP 메일 설정 (Gmail 기준, 계정 정보는 application-secret.yml 또는 환경변수로 주입)
  # Gmail은 일반 비밀번호가 아닌 '앱 비밀번호(16자리)'를 사용해야 합니다.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000 # SMTP 서버 연결 타임아웃 (ms)
          timeout: 5000           # 응답 대기 타임아웃 (ms)
          writetimeout: 5000      # 쓰기 타임아웃 (ms)

# JWT 커스텀 설정
jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration: 1800000   # 30분 (ms 단위)
  refresh-token-expiration: 604800000 # 7일 (ms 단위)

# 대기열(Waiting Queue) 설정
queue:
  estimated-tps: 20          # 예상 초당 처리량 (대기 시간 계산용)
  active-ttl-minutes: 5      # Active 상태 유지 시간 (분 단위)
  promotion:
    batch-size: 20           # 1회 스케줄러 실행 시 승격 인원수
    interval-ms: 1000        # 스케줄러 실행 주기 (ms 단위, 1초)

# 이메일 인증(Email Verification) 설정
email:
  verification:
    code-ttl-seconds: 300          # 인증번호 유효 시간 (5분) - key: email_code:{email}
    verified-ttl-seconds: 600      # 인증 완료 플래그 유지 시간 (10분) - key: email_verified:{email}
    resend-cooldown-seconds: 60    # 인증번호 재발송 최소 간격 (메일 폭탄/SMTP 할당량 소진 방지)
    max-attempts: 5                # 인증번호 1개당 최대 검증 시도 횟수 (6자리 무차별 대입 방지)